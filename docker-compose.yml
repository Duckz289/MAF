services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - harness-postgres:/var/lib/postgresql/data

volumes:
  harness-postgres:
